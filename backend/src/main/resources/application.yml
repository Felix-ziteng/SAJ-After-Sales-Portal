spring:
  application:
    name: aftersales-portal
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:aftersales}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:aftersales}
    password: ${DB_PASSWORD:aftersales}
  jpa:
    hibernate:
      # Flyway owns schema changes; Hibernate only checks entities match what Flyway built.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: ${JPA_SHOW_SQL:false}
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  auth:
    # password (default, real local username/password login) | entra — selects the AuthProvider bean
    provider: ${AUTH_PROVIDER:password}
    # Bootstrap Admin account — seeded once on first boot if it doesn't exist yet (see
    # AdminAccountSeeder). Leave ADMIN_BOOTSTRAP_PASSWORD unset to skip seeding entirely.
    bootstrap-admin:
      email: ${ADMIN_BOOTSTRAP_EMAIL:felix}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
      display-name: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:Admin}
    # Session cookie's Secure flag — only safe to enable once the app is actually served over
    # HTTPS (a plain-HTTP browser silently drops Secure cookies, which would break login).
    cookie-secure: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
