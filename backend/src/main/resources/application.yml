spring:
  application:
    name: aftersales-portal
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:aftersales}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:aftersales}
    password: ${DB_PASSWORD:aftersales}
  jpa:
    hibernate:
      # Flyway owns schema changes; Hibernate only checks entities match what Flyway built.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: ${JPA_SHOW_SQL:false}
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  auth:
    # mock (default, dev only) | entra — selects the AuthProvider bean
    provider: ${AUTH_PROVIDER:mock}

management:
  endpoints:
    web:
      exposure:
        include: health
