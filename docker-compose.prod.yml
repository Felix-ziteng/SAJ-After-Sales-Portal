services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-aftersales}
      MYSQL_USER: ${DB_USERNAME:-aftersales}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set a real DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set a real DB_ROOT_PASSWORD in .env}
    # No public port — only containers on this compose network can reach MySQL.
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m

  backend:
    image: ${DOCKERHUB_USERNAME}/saj-backend:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-aftersales}
      DB_USERNAME: ${DB_USERNAME:-aftersales}
      DB_PASSWORD: ${DB_PASSWORD:?set a real DB_PASSWORD in .env}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-password}
      JPA_DDL_AUTO: validate
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-felix}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:?set a real ADMIN_BOOTSTRAP_PASSWORD in .env}
      ADMIN_BOOTSTRAP_DISPLAY_NAME: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:-Admin}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      # Caps JVM heap so one container can't starve the others on a small instance — the JVM
      # reads this env var itself, no Dockerfile/entrypoint change needed.
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    # No public port — only nginx (on this compose network) reaches the backend.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 640m

  frontend:
    image: ${DOCKERHUB_USERNAME}/saj-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    # No public port — only nginx reaches the frontend.
    mem_limit: 320m

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    mem_limit: 64m

volumes:
  mysql_data:
